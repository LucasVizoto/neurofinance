version: '3.8'

services:
  postgres:
    image: bitnami/postgresql
    ports:
      - "5436:5432"
    environment:
      - POSTGRESQL_USERNAME=admin
      - POSTGRESQL_PASSWORD=123456
      - POSTGRESQL_DATABASE=neuro-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d neuro-backend"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8.0
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  neuro-backend:
    build:
      context: ./neuro-backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=dev
      - PORT=3001
      - DATABASE_URL=postgresql://admin:123456@postgres:5432/neuro-backend?schema=public
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./neuro-backend:/app
      - /app/node_modules

  neuro-learning:
    build:
      context: ./neuro-learning
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY}
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB_NAME=neurofinance
      - FLASK_RUN_PORT=5000
    volumes:
      - ./neuro-learning:/app

  neuro-gateway:
    build:
      context: ./neuro-gateway
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    depends_on:
      - neuro-backend
      - neuro-learning
    environment:
      - PORT=3005
      - JWT_SECRET=${JWT_SECRET}
      - USERS_SERVICE_URL=http://neuro-backend:3001
      - AI_SERVICE_URL=http://neuro-learning:5000
      - CORS_ORIGIN=*
    volumes:
      - ./neuro-gateway:/app
      - /app/node_modules

  neuro-frontend:
    build:
      context: ./neuro-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - neuro-gateway
    environment:
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_API_URL=http://localhost:3005
      - BASEPATH=
    volumes:
      - ./neuro-frontend:/app
      - /app/node_modules
      - /app/.next
